name: Build Linux Application

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Build PyInstaller application
        run: uv run pyinstaller --clean FaceRecon.spec

      - name: Make application executable
        run: chmod +x dist/FaceRecon/FaceRecon

      - name: Create Linux archive
        run: |
          tar -czf FaceRecon-linux-x86_64.tar.gz -C dist FaceRecon

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: FaceRecon-Linux-x86_64
          path: FaceRecon-linux-x86_64.tar.gz
